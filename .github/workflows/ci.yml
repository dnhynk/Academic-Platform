name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    name: dependency-source-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject forbidden dependency sources before tool or dependency setup
        run: node tools/source-preflight.mjs

  rust:
    name: rust-${{ matrix.os }}
    needs: source-preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Restore the Cargo registry keyed on the committed Cargo lockfile
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-registry-rust-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Populate the Cargo registry from the committed lockfile
        run: cargo fetch --locked
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.22.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all Rust targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Lint the encrypted object lane
        run: cargo clippy -p academic-vault --all-targets --locked --features aead-objects,phase2-fault-injection -- -D warnings
      - name: Test the encrypted object lane
        run: cargo test -p academic-vault --all-targets --locked --features aead-objects,phase2-fault-injection
      - name: Lint the rotation and retention lane
        run: cargo clippy -p academic-retention --all-targets --locked --features rotation-engine,phase2-fault-injection -- -D warnings
      - name: Test the rotation and retention lane
        run: cargo test -p academic-retention --all-targets --locked --features rotation-engine,phase2-fault-injection
      - name: Lint the transcript ingestion lane
        run: cargo clippy -p academic-transcript --all-targets --locked --features encrypted-vault,phase2-fault-injection -- -D warnings
      - name: Test the transcript ingestion lane
        run: cargo test -p academic-transcript --all-targets --locked --features encrypted-vault,phase2-fault-injection
      - name: Lint the worker sandbox lane
        run: cargo clippy -p academic-worker --all-targets --locked --features native-sandbox -- -D warnings
      - name: Test the worker sandbox lane
        run: cargo test -p academic-worker --all-targets --locked --features native-sandbox
      - name: Verify immutable v1 fixture and upcast
        run: cargo run --locked --quiet -p academic-cli -- fixture verify schemas/fixtures/signed-batch-v1.json
      - name: Replay immutable v1 fixture
        run: cargo run --locked --quiet -p academic-cli -- fixture replay schemas/fixtures/signed-batch-v1.json
      - name: Verify immutable v2 fixture and upcast
        run: cargo run --locked --quiet -p academic-cli -- fixture verify schemas/fixtures/signed-batch-v2.json
      - name: Replay immutable v2 fixture
        run: cargo run --locked --quiet -p academic-cli -- fixture replay schemas/fixtures/signed-batch-v2.json
      - name: Emit deterministic v3 fixture
        run: cargo run --locked --quiet -p academic-cli -- fixture emit --output schemas/fixtures/signed-batch-v3.json
      - name: Reject fixture byte drift
        run: git diff --exit-code -- schemas/fixtures/
      - name: Verify deterministic v3 fixture
        run: cargo run --locked --quiet -p academic-cli -- fixture verify schemas/fixtures/signed-batch-v3.json
      - name: Replay deterministic v3 fixture
        run: cargo run --locked --quiet -p academic-cli -- fixture replay schemas/fixtures/signed-batch-v3.json

  # The Phase 1 crash, replay, and restore exit, on native Windows and native
  # Linux. The two are separate verdicts: Windows proves the named-pipe endpoint
  # and NTFS durability, Linux proves the Unix domain socket and its filesystem,
  # and neither substitutes for the other. A definition existing here is not a
  # hosted run; it is evidence only once these jobs have actually concluded.
  phase1-exit:
    name: phase1-exit-${{ matrix.os }}
    needs: source-preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Restore the Cargo registry keyed on the committed Cargo lockfile
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-registry-phase1-exit-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Populate the Cargo registry from the committed lockfile
        run: cargo fetch --locked
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.22.0
      - name: Lint the fault-injection lane
        run: cargo clippy --workspace --all-targets --locked --features academic-core/phase1-fault-injection,academic-daemon/phase1-fault-injection,academic-portability/phase1-fault-injection,academic-projections/phase1-fault-injection,academic-test-support/phase1-fault-injection,academic-vault/phase1-fault-injection -- -D warnings
      - name: Run the enumerated Phase 1 exit matrix
        run: cargo test -p academic-daemon --test phase1_exit --locked --features phase1-fault-injection
      - name: Run the kill matrices the NOT_RUN rows are covered by
        run: cargo test -p academic-portability -p academic-vault --test crash --locked --offline --features phase1-fault-injection
      - name: Assemble the Phase 1 exit receipt
        run: node tools/phase1-exit.mjs --all-faults --format json

  # The encrypted store lane, on Linux only. `openssl-src` needs a native Perl
  # the hosted Windows image does not carry; t068 section 2.3-17 records that,
  # and native Windows stays the README-documented local lane with its pinned
  # interpreter. What this job buys is that `EN01` -- "kill mid store rekey;
  # exactly one of the old and new keys opens the database" -- is executed
  # rather than cited, because `P2-K5`'s rotation journal carries a
  # store-database unit whose executor is this lane's `PRAGMA rekey`.
  encrypted-store-lane:
    name: encrypted-store-lane-${{ matrix.os }}
    needs: source-preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Restore the Cargo registry keyed on the committed Cargo lockfile
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-registry-encrypted-store-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Populate the Cargo registry from the committed lockfile
        run: cargo fetch --locked
      - name: Lint the encrypted store lane
        run: cargo clippy -p academic-store --no-default-features --features sqlcipher-store --all-targets --locked -- -D warnings
      - name: Test the encrypted store lane
        run: cargo test -p academic-store --no-default-features --features sqlcipher-store --locked
      - name: Run EN01, the store-rekey kill the rotation journal depends on
        run: cargo test -p academic-store --no-default-features --features sqlcipher-store --locked --test encrypted_profile encrypted::store_rekey_kill_leaves_exactly_one_working_key -- --exact

  # The encrypted portability lane, on Linux only, for the same toolchain
  # reason as the store lane above. What this job buys is that the seam where
  # `P2-K5`'s rotation and deletion meet `P2-K2`'s store and `P2-K4`'s backup
  # and restore is executed rather than cited. `T111` found a named acceptance
  # row there that imitated a restore with `fs::copy` and passed while the
  # product restore read no tombstone at all; `encrypted_rotation` calls the
  # product functions, and no hosted job built this lane before.
  encrypted-portability-lane:
    name: encrypted-portability-lane-${{ matrix.os }}
    needs: source-preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Restore the Cargo registry keyed on the committed Cargo lockfile
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-registry-encrypted-portability-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Populate the Cargo registry from the committed lockfile
        run: cargo fetch --locked
      - name: Lint the encrypted portability lane
        run: cargo clippy -p academic-portability --no-default-features --features encrypted-portability,phase2-fault-injection --all-targets --locked -- -D warnings
      - name: Test the encrypted portability lane
        run: cargo test -p academic-portability --no-default-features --features encrypted-portability --locked
      - name: Run the BK and RS kill rows under encryption
        run: cargo test -p academic-portability --no-default-features --features encrypted-portability,phase2-fault-injection --locked --test encrypted_crash

  # The rotation orchestration lane. Phase 2 has not accepted a rotation and
  # every entry point that would run one refuses, which is what the default
  # graphs above execute. This job is what keeps the machinery under those
  # refusals honest: it selects `rotation-orchestration`, and with it the
  # `KY03`-`KY05` fault rows and the `T114`/`T116` seam closures, so the code
  # `P2-P2` reopens is code that was still being run. Nothing here ships — no
  # product graph resolves the feature, which `phase1-scaffold-policy.test.mjs`
  # checks — and the refusing rows and these executing rows never link into one
  # binary.
  rotation-orchestration-lane:
    name: rotation-orchestration-lane-${{ matrix.os }}
    needs: source-preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Restore the Cargo registry keyed on the committed Cargo lockfile
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-registry-rotation-orchestration-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Populate the Cargo registry from the committed lockfile
        run: cargo fetch --locked
      - name: Lint the rotation orchestration lane
        run: cargo clippy -p academic-retention --all-targets --locked --features rotation-engine,rotation-orchestration,phase2-fault-injection -- -D warnings
      - name: Run the rotation rows, including KY03 to KY05
        run: cargo test -p academic-retention --all-targets --locked --features rotation-engine,rotation-orchestration,phase2-fault-injection
      - name: Lint the encrypted portability rotation lane
        run: cargo clippy -p academic-portability --no-default-features --features encrypted-portability-rotation,phase2-fault-injection --all-targets --locked -- -D warnings
      - name: Run the rotation seam over the real store
        run: cargo test -p academic-portability --no-default-features --features encrypted-portability-rotation --locked

  contracts:
    name: pnpm-contracts
    needs: source-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Restore the Cargo registry keyed on the committed Cargo lockfile
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-registry-contracts-ubuntu-latest-${{ hashFiles('Cargo.lock') }}
      - name: Populate the Cargo registry from the committed lockfile
        run: cargo fetch --locked
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.22.0
      - name: Restore the pnpm store keyed on the committed pnpm lockfile
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-store-contracts-ubuntu-latest-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify schema, semantic parity, fixture, and Proto contracts
        run: pnpm verify:contracts
      - name: Check structural dependency-source baseline and negative fixtures
        run: pnpm security
