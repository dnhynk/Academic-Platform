[workspace]
members = [
  "crates/admission",
  "crates/capture",
  "crates/capture-client",
  "crates/capture-gate",
  "crates/cli",
  "crates/consent",
  "crates/contracts",
  "crates/connector",
  "crates/core",
  "crates/crypto",
  "crates/curriculum",
  "crates/daemon",
  "crates/desktop",
  "crates/domain",
  "crates/egress",
  "crates/egress-boundary",
  "crates/evidence-center",
  "crates/export-job",
  "crates/indexer",
  "crates/ingestion",
  "crates/keystore-platform",
  "crates/ledger",
  "crates/model-run",
  "crates/portability",
  "crates/policy",
  "crates/projections",
  "crates/proposal",
  "crates/record",
  "crates/repository",
  "crates/repository-analysis",
  "crates/requirement",
  "crates/repository-correlation",
  "crates/repository-analyzer",
  "crates/recovery",
  "crates/retention",
  "crates/rpc",
  "crates/scenario",
  "crates/store",
  "crates/store-platform",
  "crates/test-support",
  "crates/transcript",
  "crates/transcription",
  "crates/untrusted-content",
  "crates/vault",
  "crates/worker",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
assert_cmd = { version = "=2.2.2", default-features = false }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
ciborium = "=0.2.2"
clap = { version = "=4.6.6", features = ["derive"] }
ed25519-dalek = "=2.2.0"
getrandom = { version = "=0.4.3", default-features = false, features = ["std"] }
hex = "=0.4.3"
hkdf = "=0.12.4"
hmac = "=0.12.1"
predicates = { version = "=3.1.4", default-features = false }
proptest = "=1.11.0"
prost = { version = "=0.14.1", default-features = false, features = ["derive", "std"] }
prost-build = { version = "=0.14.1", default-features = false }
protoc-bin-vendored = { version = "=3.2.0", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "hooks", "limits"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "net", "process", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = { version = "=2.6.1", default-features = false }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
trybuild = "=1.0.120"
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
uuid = { version = "=1.25.0", features = ["serde", "v7"] }
windows-sys = { version = "=0.61.2", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc", "derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
