[workspace]
members = [
  "crates/cli",
  "crates/contracts",
  "crates/core",
  "crates/domain",
  "crates/ledger",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1.0.99"
ciborium = "0.2.2"
clap = { version = "4.5.46", features = ["derive"] }
ed25519-dalek = "2.2.0"
hex = "0.4.3"
hmac = "0.12.1"
proptest = "1.7.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
uuid = { version = "1.18.0", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
