[package]
name = "academic-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
phase1-fault-injection = [
  "academic-portability/phase1-fault-injection",
  "academic-projections/phase1-fault-injection",
  "academic-vault/phase1-fault-injection",
]

[dependencies]
academic-contracts = { path = "../contracts" }
academic-domain = { path = "../domain" }
academic-ledger = { path = "../ledger" }
academic-portability = { path = "../portability" }
academic-projections = { path = "../projections" }
academic-rpc = { path = "../rpc" }
academic-store = { path = "../store" }
academic-vault = { path = "../vault" }
ed25519-dalek.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# `tests/scenario_isolation.rs` needs the projection engine and the canonical
# writer in one process to prove that driving the first leaves the second
# untouched. The edge is deliberately dev-only: `academic-scenario` is a
# projection lane, and a shipping edge from the composition root would be the
# start of the coupling this crate exists to keep absent.
academic-scenario = { path = "../scenario" }
proptest.workspace = true
rusqlite.workspace = true

[lints]
workspace = true
