[package]
name = "academic-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Binds the recipient key source to the reviewed native broker. Off by default
# so the key schedule, recipient record, and unlock policy are testable without
# touching the host operating system.
os-keystore = [
  "dep:academic-keystore-platform",
  "academic-keystore-platform/secret-service",
]
# Test-only deterministic failpoints. A product build contains no environment
# lookup and no crash switch.
phase2-fault-injection = []

[dependencies]
academic-keystore-platform = { path = "../keystore-platform", optional = true }
argon2.workspace = true
chacha20poly1305.workspace = true
ciborium.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
ciborium.workspace = true
hex.workspace = true
tempfile.workspace = true

[lints]
workspace = true
