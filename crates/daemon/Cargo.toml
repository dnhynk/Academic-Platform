[package]
name = "academic-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "academicd"
path = "src/main.rs"

[dependencies]
academic-core = { path = "../core" }
academic-rpc = { path = "../rpc" }
academic-store = { path = "../store" }
getrandom.workspace = true
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

# This crate contains the reviewed Windows named-pipe and Unix local-IPC
# boundary. Native calls remain denied unless locally allowed with a concrete
# safety proof.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
