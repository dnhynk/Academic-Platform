[package]
name = "academic-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "academicd"
path = "src/main.rs"

[features]
default = []
# Compiles the X1 exit harness lane. It forwards to the crates that own
# the named failpoints and is never selected by a default build.
phase1-fault-injection = ["academic-core/phase1-fault-injection"]

[dependencies]
academic-core = { path = "../core" }
academic-rpc = { path = "../rpc" }
academic-store = { path = "../store" }
getrandom.workspace = true
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
# Test-only edges used by the X1 exit harness to drive projection
# rebuilds and to read published backup and restore evidence. The harness
# vocabulary itself arrives through `#[path]` includes of
# `crates/test-support/src`, so `academic-test-support` keeps no dependents.
academic-portability = { path = "../portability" }
academic-projections = { path = "../projections" }
academic-vault = { path = "../vault" }
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

# This crate contains the reviewed Windows named-pipe and Unix local-IPC
# boundary. Native calls remain denied unless locally allowed with a concrete
# safety proof.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
