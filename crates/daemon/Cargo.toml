[package]
name = "academic-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "academicd"
path = "src/main.rs"
required-features = ["plaintext-daemon"]

[features]
default = ["plaintext-daemon"]
plaintext-daemon = ["academic-core/plaintext-core", "academic-store/bundled-sqlite"]
encrypted-synthetic-daemon = ["academic-core/encrypted-synthetic-core", "academic-store/sqlcipher-store"]
# Compiles the X1 exit harness lane. It forwards to the crates that own
# the named failpoints and is never selected by a default build.
phase1-fault-injection = ["plaintext-daemon", "academic-core/phase1-fault-injection"]

[dependencies]
academic-admission = { path = "../admission" }
academic-core = { path = "../core", default-features = false }
academic-rpc = { path = "../rpc" }
academic-store = { path = "../store", default-features = false }
getrandom.workspace = true
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
academic-core = { path = "../core", features = ["synthetic-detail-fixtures"] }
# Test-only edges used by the X1 exit harness to drive projection
# rebuilds and to read published backup and restore evidence. The harness
# vocabulary itself arrives through `#[path]` includes of
# `crates/test-support/src`, so `academic-test-support` keeps no dependents.
academic-portability = { path = "../portability" }
academic-projections = { path = "../projections" }
academic-vault = { path = "../vault" }
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

# This crate contains the reviewed Windows named-pipe and Unix local-IPC
# boundary. Native calls remain denied unless locally allowed with a concrete
# safety proof.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[[test]]
name = "availability"
required-features = ["plaintext-daemon"]

[[test]]
name = "backpressure"
required-features = ["plaintext-daemon"]

[[test]]
name = "details"
required-features = ["plaintext-daemon"]

[[test]]
name = "domain_details"
required-features = ["plaintext-daemon"]

[[test]]
name = "multiclient"
required-features = ["plaintext-daemon"]

[[test]]
name = "phase1_exit"
required-features = ["plaintext-daemon"]

[[test]]
name = "singleton"
required-features = ["plaintext-daemon"]

[[test]]
name = "unix_socket"
required-features = ["plaintext-daemon"]

[[test]]
name = "windows_pipe"
required-features = ["plaintext-daemon"]
