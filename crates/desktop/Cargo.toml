[package]
name = "academic-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
desktop-runtime = ["dep:tauri", "dep:tauri-build", "dep:serde", "dep:tokio", "dep:uuid"]

[[bin]]
name = "academic-desktop"
path = "src/main.rs"
required-features = ["desktop-runtime"]

[dependencies]
academic-rpc = { path = "../rpc" }
thiserror.workspace = true
serde = { workspace = true, optional = true }
tauri = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[build-dependencies]
tauri-build = { workspace = true, optional = true }

[dev-dependencies]
# `serde_json` is one of the compile-fail cases: serialising a sealed optimistic
# value must not compile, and the case needs a serialiser to try it with.
serde_json.workspace = true
trybuild.workspace = true

[lints]
workspace = true
