[package]
name = "academic-portability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["plaintext-portability"]
# The Phase 1 synthetic lane: deterministic export, plaintext backup, and
# empty-profile restore over the bundled plaintext SQLite build.
plaintext-portability = ["dep:academic-projections", "academic-store/bundled-sqlite"]
# The `P2-K4` encrypted lane: a snapshot of the SQLCipher profile, the
# `AEAD_CHUNKED_V2` object closure, and a manifest sealed under a backup key
# independent of the device wrapper. Non-default and non-overlapping with the
# plaintext lane, because `academic-store`'s two lanes cannot link into one
# binary.
encrypted-portability = [
  "dep:academic-crypto",
  "dep:academic-recovery",
  "dep:academic-retention",
  "academic-retention/rotation-engine",
  "academic-store/sqlcipher-store",
  "academic-vault/aead-objects",
]
# The same encrypted lane with the rotation orchestration Phase 2 does not
# accept selected. It exists so the machinery keeps executed acceptance rows —
# `KY03`-`KY05`, the `T114`/`T116` seam closures — while the refusal is what the
# plain `encrypted-portability` lane and every product graph see. No binary
# selects it; the `rotation-orchestration-lane` CI job is what runs it.
encrypted-portability-rotation = [
  "encrypted-portability",
  "academic-retention/rotation-orchestration",
]
phase1-fault-injection = []
# Compiles the same BK/RS failpoints for the encrypted lane, so the Phase 1
# fault matrix is re-run under encryption rather than restated.
phase2-fault-injection = []

[dependencies]
academic-admission = { path = "../admission" }
academic-contracts = { path = "../contracts" }
academic-crypto = { path = "../crypto", optional = true }
academic-domain = { path = "../domain" }
academic-projections = { path = "../projections", optional = true }
academic-recovery = { path = "../recovery", optional = true }
# `P2-K5`'s tombstone record and its keyless positioned re-deletion. The
# encrypted restore calls them, so a deletion reaches the copies a backup
# holds through the product path rather than through a test that imitates it.
academic-retention = { path = "../retention", optional = true, default-features = false }
academic-store = { path = "../store", default-features = false }
academic-vault = { path = "../vault" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
academic-crypto = { path = "../crypto" }
ed25519-dalek.workspace = true
zeroize.workspace = true

[lints]
workspace = true
