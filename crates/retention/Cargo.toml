[package]
name = "academic-retention"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The `P2-K5` rotation and crypto-shredding lane. It is the vault's encrypted
# object namespace that this feature buys: the journal, the plan, the
# revocation contract, and the retention vocabulary below are pure Rust and
# compile in the default lane, so they run in hosted CI on every platform.
# Only the executor that rewraps and shreds real `AEAD_CHUNKED_V2` objects
# needs `academic-vault/aead-objects`, which is itself non-default.
rotation-engine = ["dep:academic-vault", "academic-vault/aead-objects"]
# Test-only deterministic `KY03`-`KY05` and `RB02` failpoints. `RB01`'s lives in
# `academic-vault`, beside the key slot it destroys, so selecting this feature
# selects that one too. A product build contains no environment lookup and no
# crash switch.
phase2-fault-injection = ["academic-vault?/phase2-fault-injection"]

[dependencies]
academic-crypto = { path = "../crypto" }
academic-domain = { path = "../domain" }
academic-vault = { path = "../vault", optional = true }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
zeroize.workspace = true

[lints]
workspace = true
