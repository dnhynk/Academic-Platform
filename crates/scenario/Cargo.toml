[package]
name = "academic-scenario"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
academic-domain = { path = "../domain" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The compile-fail suite compiles its cases against this crate plus this crate's
# dev-dependencies, so the domain types a projection must never become have to
# be reachable from a `tests/compile_fail` case as well.
academic-domain = { path = "../domain" }
academic-admission = { path = "../admission" }
# `P2-R2`'s finding type is the third thing whose construction is closed by
# compilation rather than by a check, beside `Proposed<T>` and
# `VerifiedAdmission`. Its cases live in this suite rather than in a fourth
# `compile_fail` target so the README's verification block gains no command.
academic-repository-analysis = { path = "../repository-analysis" }
proptest.workspace = true
serde_json.workspace = true
trybuild.workspace = true

[lints]
workspace = true
