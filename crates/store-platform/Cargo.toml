[package]
name = "academic-store-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = [
  "fs",
  "process",
  "std",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

# This crate is the sole reviewed native FFI boundary. It intentionally does
# not inherit the workspace's `unsafe_code = "forbid"`; all other workspace
# Rust and Clippy denies are reproduced exactly.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
