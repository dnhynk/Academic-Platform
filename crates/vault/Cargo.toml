[package]
name = "academic-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
phase1-fault-injection = []

[dependencies]
academic-domain = { path = "../domain" }
academic-store = { path = "../store" }
getrandom.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_SystemServices",
] }

# This crate contains the reviewed Windows vault durability boundary. It does
# not inherit the workspace's `unsafe_code = "forbid"`; every private unsafe
# FFI block remains denied unless locally allowed with a concrete safety proof.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
